# Base PostGIS locale pour le développement : docker compose up -d
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crée aussi la base radar_test au premier démarrage
      - ./docker/initdb:/docker-entrypoint-initdb.d
volumes:
  pgdata:
